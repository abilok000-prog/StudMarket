# Builds the iOS app on a macOS runner (no Mac needed locally).
# Without an Apple Developer account this produces a Simulator build, which proves the app compiles.
# To install on a real iPhone (TestFlight), add Apple signing secrets — see README.
name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Copy web app into iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/StudMarket-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: StudMarket-ios-simulator
          path: StudMarket-simulator.zip
